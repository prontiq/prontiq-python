[project]
name = "prontiq"
version = "0.3.0"
description = "The official Python SDK for the Prontiq Address API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Prontiq", email = "support@prontiq.dev"}]
dependencies = ["httpx>=0.28,<1", "attrs>=25.3", "python-dateutil>=2.9"]

[project.urls]
Homepage = "https://prontiq.dev"
Repository = "https://github.com/prontiq/prontiq-python"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prontiq"]

[dependency-groups]
dev = ["openapi-python-client==0.29.1", "pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff==0.15.6", "mypy>=1.18,<2", "types-python-dateutil>=2.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
files = ["src/prontiq"]
strict = true
