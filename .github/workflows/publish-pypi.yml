name: Publish PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the release commit to be on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"
          python-version: "3.12"
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(uv version --short)"
      - run: uv sync --frozen
      - run: uv run python scripts/generate.py --check
      - run: uv run pytest
      - run: uv build
      - name: Publish verified distributions
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
